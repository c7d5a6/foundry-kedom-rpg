# Generates TypeScript from the Go domain models, so the Forge web UI and the
# Foundry system share one definition of a skill, background, or region instead
# of two hand-maintained copies. See ADR-012.
#
# Run: cd packages/forge/api && tygo generate   (or `npm run forge:types`)
# Output is gitignored and regenerated; never edit it by hand.

packages:
  - path: "github.com/c7d5a6/foundry-kedom-rpg/packages/forge/api/internal/model"
    output_path: "../../shared/src/generated/content.ts"

    # Emitted verbatim at the top of the generated file.
    frontmatter: |
      /**
       * GENERATED by tygo from packages/forge/api/internal/model. DO NOT EDIT.
       * Regenerate with `npm run forge:types`.
       */

    type_mappings:
      # Slugs are branded in TypeScript so a bare string cannot be passed where an
      # identity is expected. See docs/system/data-model.md.
      "model.SkillSlug": "string /* SkillSlug */"
      "model.SpecializationSlug": "string /* SpecializationSlug */"
      "time.Time": "string /* RFC3339 */"
      "sql.NullString": "string | null"
      "sql.NullInt64": "number | null"
      "uuid.UUID": "string /* uuid */"

    # Interfaces read better than type aliases for the record shapes the UI consumes.
    fallback_type: "unknown"
    preserve_comments: "types"
    exclude_files:
      - "doc.go"
